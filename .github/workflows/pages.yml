name: Deploy to GitHub Pages (old address)

# Keeps https://akhilesh90akp.github.io/eventscope/ updated until everyone has moved
# to https://app.eventscope.in/. Delete this file after the move.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /eventscope/
      VITE_AUTH_DOMAIN: eventscope-app.firebaseapp.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
