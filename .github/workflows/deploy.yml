name: Deploy to Firebase Hosting

# Every push to main publishes two Firebase Hosting sites:
#   app  -> https://app.eventscope.in/  (the built app)
#   site -> https://eventscope.in/      (the website/ folder, plain files)
# Needs the GitHub secret FIREBASE_SERVICE_ACCOUNT (see README, "Hosting").

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Deploy the app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: eventscope-app
          target: app
          channelId: live
      # The WhatsApp number is not kept in git: it comes from the repo secret
      # SITE_WHATSAPP (digits only, with country code, e.g. 919876543210).
      # Without the secret the WhatsApp buttons open the app instead.
      - name: Fill in the website contact number
        env:
          WA: ${{ secrets.SITE_WHATSAPP }}
        run: |
          if [ -n "$WA" ]; then sed -i "s/WHATSAPP_NUMBER/$WA/g" website/*.html; fi
      - name: Deploy the website
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: eventscope-app
          target: site
          channelId: live
