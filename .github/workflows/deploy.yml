name: Deploy to Firebase Hosting

# Every push to main builds the app and publishes it to https://app.eventscope.in/
# Needs the GitHub secret FIREBASE_SERVICE_ACCOUNT (see README, "Hosting").

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: eventscope-app
          channelId: live
