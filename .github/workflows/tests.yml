# Runs on every push to main and every pull request:
#   1. Unit tests for money/bill/Job Log math (tests/helpers.test.mjs)
#   2. Firestore security-rules tests against the Firebase emulator
#      (tests/firestore.rules.test.mjs)
# A red ✗ means a calculation or a security rule is broken — don't deploy
# firestore.rules to the real project until this is green.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Security rules tests
        run: |
          npm install -g firebase-tools@14
          npm run test:rules
