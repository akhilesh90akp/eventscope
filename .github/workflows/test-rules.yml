# Runs the Firestore security-rules tests (tests/firestore.rules.test.mjs)
# against the Firebase emulator on every push and pull request.
# A red ✗ here means tenant isolation, roles or suspension rules are broken —
# do not deploy those rules to the real project until it's green.
name: Test security rules

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'tests/**', 'package.json', '.github/workflows/test-rules.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools@14
      - run: npm run test:rules
