<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- Open the connections to Google/Firebase while the app is still loading -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#331948" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" = solid status bar on iPhone home-screen apps, so content never slides under the clock/notch -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EventScope" />
    <meta name="description" content="EventScope — Every event, in focus. Quotations, billing and reports for event management companies." />
    <title>EventScope</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // ============================================================
      // Service Worker registration + auto-update banner
      //
      // Problem this solves: the SW's cache-first strategy for JS/CSS
      // means an already-open tab can keep running old code indefinitely
      // even after a new version is deployed, since ES modules already
      // loaded in memory don't re-fetch on their own. This shows a
      // "New version ready" pop-up the moment a new SW
      // takes over, instead of silently serving stale code forever.
      // ============================================================
      if ('serviceWorker' in navigator) {
        // Pop-up in the same style as the app's confirm pop-ups. "Later"
        // closes it and leaves a small bar at the bottom to refresh from.
        function showUpdateBar() {
          if (document.getElementById('bb-update-banner')) return;
          var bar = document.createElement('div');
          bar.id = 'bb-update-banner';
          bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
            'background:#331948;color:#fff;padding:12px 16px;display:flex;' +
            'align-items:center;justify-content:center;gap:12px;font:14px Inter,system-ui,sans-serif;' +
            'box-shadow:0 -2px 8px rgba(0,0,0,0.15);padding-bottom:calc(12px + env(safe-area-inset-bottom));';
          bar.innerHTML =
            '<span>A new version of EventScope is available.</span>' +
            '<button id="bb-update-btn" style="background:#fff;color:#331948;border:none;' +
            'padding:6px 14px;border-radius:6px;font-weight:600;cursor:pointer;">Refresh</button>';
          document.body.appendChild(bar);
          document.getElementById('bb-update-btn').addEventListener('click', function() {
            window.location.reload();
          });
        }

        function showUpdateBanner() {
          if (document.getElementById('bb-update-popup') || document.getElementById('bb-update-banner')) return;
          var pop = document.createElement('div');
          pop.id = 'bb-update-popup';
          pop.setAttribute('role', 'alertdialog');
          pop.setAttribute('aria-modal', 'true');
          pop.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;' +
            'justify-content:center;padding:16px;font-family:Inter,system-ui,sans-serif;';
          pop.innerHTML =
            '<div style="position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)"></div>' +
            '<div style="position:relative;width:100%;max-width:384px;background:#fff;border-radius:16px;' +
              'box-shadow:0 25px 50px -12px rgba(0,0,0,.35);padding:20px;color:#1f2937">' +
              '<div style="width:44px;height:44px;border-radius:999px;background:#ede9fe;color:#6d28d9;' +
                'display:flex;align-items:center;justify-content:center;margin-bottom:12px">' +
                '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>' +
                '<path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg></div>' +
              '<h2 style="margin:0 0 6px;font-size:18px;font-weight:700">New version ready</h2>' +
              '<p style="margin:0;font-size:14px;line-height:1.6;color:#6b7280">Refresh to get the latest changes. ' +
                'Everything you have saved stays as it is.</p>' +
              '<div style="display:flex;gap:10px;margin-top:20px">' +
                '<button id="bb-update-later" style="flex:1;padding:10px 0;border-radius:12px;border:1px solid #e5e7eb;' +
                  'background:#fff;color:#1f2937;font:600 14px Inter,system-ui,sans-serif;cursor:pointer">Later</button>' +
                '<button id="bb-update-now" style="flex:1;padding:10px 0;border-radius:12px;border:none;' +
                  'background:#652D90;color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer">Refresh now</button>' +
              '</div></div>';
          document.body.appendChild(pop);
          document.getElementById('bb-update-now').addEventListener('click', function() {
            window.location.reload();
          });
          document.getElementById('bb-update-later').addEventListener('click', function() {
            pop.remove();
            showUpdateBar();
          });
        }

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%BASE_URL%sw.js', {scope: '%BASE_URL%'})
            .then(function(reg) {
              console.log('SW registered');

              // A new SW is already waiting (e.g. tab was open during deploy)
              if (reg.waiting) showUpdateBanner();

              // Watch for a new SW appearing and finishing install
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function() {
                  // 'installed' + an existing controller = a genuine update,
                  // not the very first install for a first-time visitor
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    showUpdateBanner();
                  }
                });
              });

              // Check for updates periodically while the app is open
              setInterval(function() { reg.update(); }, 15 * 60 * 1000);
            })
            .catch(function(err) { console.log('SW registration failed:', err); });
        });
      }
    </script>
  </body>
</html>
